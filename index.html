<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Sudoku</title>
    <meta
      name="description"
      content="A deterministic Sudoku. Every puzzle is rebuilt from its date, so the same day always gives the same grid on every device."
    />
    <meta name="theme-color" content="#000000" />
    <!-- Governs the pre-paint canvas colour, before any CSS can apply. -->
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Pixel font blocks: a fallback flash would shift the title badly. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Boot mask: pure-black with no visible content until the app has mounted
         and its styles are applied, then reveal — kills the flash of unstyled
         HTML (Vite injects CSS via JS in dev; also guards a slow first load). -->
    <style>
      html {
        background: #000;
      }
      body {
        visibility: hidden;
      }
    </style>
    <script>
      addEventListener("DOMContentLoaded", function () {
        requestAnimationFrame(function () {
          document.body.style.visibility = "visible";
        });
      });
    </script>
    <noscript
      ><style>
        body {
          visibility: visible;
        }
      </style></noscript
    >
    <!-- Amber Phosphor theme tokens — single source of truth -->
    <link rel="stylesheet" href="https://theme.chakri.me/tokens.css" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 24px; font-family: monospace; color: #ece7da">
        This Sudoku is generated in your browser from today's date, so it needs
        JavaScript.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
